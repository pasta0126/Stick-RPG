; Firmware para M5StickC Plus2.
;   pio run                 → compilar
;   pio run -t upload       → grabar
;   pio device monitor      → consola serie
; La lógica (src/core) también se compila en el PC: ver Makefile.

[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32
board = m5stack-stickc-plus2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
build_flags =
    -Wall

; Versión de prueba: un enemigo de cada tipo, seguidos y en orden, todos con
; fuerza de nivel 1.  pio run -e prueba -t upload
[env:prueba]
extends = env:m5stickc_plus2
build_flags =
    ${env:m5stickc_plus2.build_flags}
    -DPRUEBA_ENEMIGOS
